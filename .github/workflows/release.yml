name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Draft a release with the production zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the plugin version
        run: |
          version=$(python -c 'import json; print(json.load(open("plugins/onyxia/.claude-plugin/plugin.json"))["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin version $version."
            exit 1
          fi

      - name: Build production
        run: python scripts/build.py production --out dist

      # A draft, so a person writes the release note before customers see it.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/onyxia-production-*.zip \
            --draft --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
